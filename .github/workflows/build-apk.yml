name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version

          echo "=== JAVA_HOME Directory ==="
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set!" >&2
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"

          if [ -z "$JAVA_VER_STR" ]; then
            echo "Error: Unable to detect Java version from 'java -version' output!" >&2
            exit 1
          fi

          MAJOR_VER=$(echo "$JAVA_VER_STR" | sed -E 's/^1\.//' | cut -d'.' -f1)
          echo "Detected Java major version: $MAJOR_VER"

          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Detected Java major version '$MAJOR_VER' is not a valid integer!" >&2
            exit 1
          fi

          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($MAJOR_VER) is lower than required version 17!" >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java $MAJOR_VER is active (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to find ./debug.keystore after generation attempt!" >&2
            exit 1
          fi

          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at: $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Failing step because app/build/outputs/apk/debug/app-debug.apk is missing." >&2
            exit 1
          fi

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK does not exist!" >&2
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file!" >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty (0 bytes)!" >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have .apk extension!" >&2
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk!" >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified debug APK at: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RUN_NUM="${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${RUN_NUM}.apk"
          DEST_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          echo "Copying verified APK to temporary asset directory..."
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $DEST_PATH" >&2
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH ($ASSET_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH" >&2
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is empty at $ASSET_PATH" >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not end in .apk: $ASSET_PATH" >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES="### Automatic Debug APK Build

  - **Build Source**: Automatically generated debug APK built by GitHub Actions.
  - **Workflow Run**: #${GITHUB_RUN_NUMBER} (Attempt: ${GITHUB_RUN_ATTEMPT})
  - **Source Commit**: \`${GITHUB_SHA}\`
  - **Intended Use**: This APK is intended for testing and development purposes.
  - **Notice**: This APK is not a Play Store production release and is signed only with a temporary debug keystore.

  #### Download
  Download the debug APK directly from the **Assets** section below:
  - **File**: \`${ASSET_NAME}\`"

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            RELEASE_VIEW_TITLE=$(gh release view "$RELEASE_TAG" --json name -q .name 2>/dev/null || echo "Debug APK Build #${GITHUB_RUN_NUMBER}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_VIEW_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "## Debug APK Build and Release Successful"
              echo ""
              echo "**GitHub Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_VIEW_TITLE"
              echo "- **Direct APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "You can download the debug APK directly to your phone or emulator from the **Assets** section of the [GitHub Release]($RELEASE_URL)."
              echo ""
              echo "ℹ️ **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also stored and available for download under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Release publishing was unsuccessful or skipped (outcome: $RELEASE_OUTCOME)."
            echo "The debug APK build succeeded and the GitHub Actions artifact remains available."
            echo "Artifact name: app-debug-apk"

            {
              echo "## ⚠️ Debug APK Built Successfully (Release Publishing Notice)"
              echo ""
              echo "**Warning:** GitHub Release publishing did not complete successfully (outcome: \`$RELEASE_OUTCOME\`)."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **GitHub Actions Artifact:** The debug APK was successfully preserved and can be downloaded from this workflow run as artifact **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
